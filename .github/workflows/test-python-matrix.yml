# Free 3-OS CI for the Python cross-platform surface (skill CLI + MCP server).
# Public repos: standard GitHub-hosted runners (ubuntu/macos/windows-latest)
# are free with unlimited minutes — no -large/-xlarge labels needed.
# Accounts are capped at 20 concurrent jobs total / 5 macOS (queuing only).
# Triggered only by changes to the Python surface; the JS/extension surface
# lives in test-js-matrix.yml.
name: test-python-matrix

on:
  pull_request:
    paths:
      - 'public/agent-skill/**'        # skill 模板源（SKILL.md / scripts/ / reference/）
      - 'mcp-server/**'                # MCP server 包（pyproject + tests）
      - 'skills/**'                    # 渲染的 skill 发布目录（drift 锁定测试覆盖）
      - 'scripts/python.mjs'           # 跨平台解释器解析器
      - 'scripts/gen_skills.py'        # skill 发布目录渲染器
      - 'tests/scripts/**'             # Python 单测
      - 'package.json'                 # test:python / test:mcp / gen-skills 脚本定义
      - '.github/workflows/test-python-matrix.yml'  # 自身改动自触发
  push:
    branches: [main]
    paths:
      - 'public/agent-skill/**'
      - 'mcp-server/**'
      - 'skills/**'
      - 'scripts/python.mjs'
      - 'scripts/gen_skills.py'
      - 'tests/scripts/**'
      - 'package.json'
      - '.github/workflows/test-python-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的旧矩阵运行可安全取消（避免排队占满 5 个 macOS runner 配额）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-matrix:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: mcp-server/pyproject.toml

      # Node is only needed to run `node scripts/python.mjs` (the cross-OS
      # interpreter resolver); no npm install / JS checks in this matrix.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # `mcp-server[dev]` pulls the runtime deps (mcp, pydantic) declared in
      # pyproject.toml plus pytest via the `dev` optional-dependencies extra.
      - name: Install Python deps
        run: python -m pip install --upgrade pip && pip install -e "mcp-server[dev]"

      # Proves the interpreter resolver picks a real Python 3 on this OS
      # (filters the Windows Store stub that prints nothing).
      - name: Smoke test interpreter resolution
        run: node scripts/python.mjs --version

      - name: Python skill tests
        run: npm run test:python

      - name: MCP server tests
        run: npm run test:mcp
