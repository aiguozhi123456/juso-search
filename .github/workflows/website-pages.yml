# 官网展示站 → GitHub Pages
# 站点源码在 website/（Hugo，无主题）。部署前需在仓库 Settings → Pages
# 将 Source 设为 "GitHub Actions"。
name: website-pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true
      - name: Build
        run: >
          hugo --source website --minify
          --baseURL https://aiguozhi123456.github.io/juso-search/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
