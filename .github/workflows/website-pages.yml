# 官网展示站 → GitHub Pages
# 站点源码在 website/（Hugo，无主题）。部署前需在仓库 Settings → Pages
# 将 Source 设为 "GitHub Actions"。
name: website-pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      # 令牌源改动同样触发：网站 CSS 必须与 tokens.css 的 must-match 集保持一致
      - 'entrypoints/shared/tokens.css'
      # 资产源改动同样触发：网站静态资源必须与扩展 icons / 文档截图逐字节一致
      - 'public/icons/**'
      - 'docs/assets/screens/**'
      - '.github/workflows/website-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 版本以 commit SHA 固定；升级时同步更新注释
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.164.0'
          extended: true
      # 令牌漂移锁：网站 CSS 必须与扩展 tokens.css 的 must-match 集一致
      # （品牌色 / 中性色 / 动效时长）。有意分歧（字体、阴影、站点独有令牌）
      # 已记录在 style.css :root 注释中，脚本允许其不同；runner 自带 Python 3。
      - name: Design token drift-lock
        run: python scripts/check-website-tokens.py
      # 资产漂移锁：website/static/icons ↔ public/icons（1:1 按文件名，21 对）
      # 与 website/static/img/screenshot-* ↔ docs/assets/screens（README.md
      # 映射表，4 对）必须逐字节一致；runner 自带 Python 3。
      - name: Asset drift-lock
        run: python scripts/check-website-assets.py
      - name: Build
        run: hugo --source website --minify
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
