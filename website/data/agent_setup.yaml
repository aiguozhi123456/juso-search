# 智能体面接入步骤 —— 取自 README「本地 AI 智能体」章节（复述）
steps:
  - n: "1"
    title_zh: "安装扩展"
    title_en: "Install the extension"
    body_zh: "在将运行 Agent 调用的 Chromium 系浏览器（Chrome、Edge、Chromium 等）中安装并启用双面搜。<code>engine-search</code> 无需配置 AI 搜索服务；调用 AI 搜索 API 时才需配置对应服务。"
    body_en: "Install and enable Juso in the Chromium-family browser that will run Agent calls (Chrome, Edge, Chromium, etc.). <code>engine-search</code> needs no AI service configuration; configure a service only when calling an AI search API."
  - n: "2"
    title_zh: "开启 Agent Bridge"
    title_en: "Enable Agent Bridge"
    body_zh: "打开扩展选项页 → 通用 → Agent Bridge，开启总开关（默认关闭）。要用 <code>engine-search</code> 检索传统引擎，再单独开启其子开关。"
    body_en: "Open Options → General → Agent Bridge and turn on the master switch (off by default). To use <code>engine-search</code> for conventional engines, also enable its sub-switch."
  - n: "3"
    title_zh: "下载配套技能"
    title_en: "Download the companion skill"
    body_zh: "在同一页面点「下载配套 Agent Skill」，技能包自动按本机扩展 ID 盖章；解压后拷到 <code>.agents/skills/</code>。"
    body_en: "On the same page, click “Download companion Agent Skill” — the skill is auto-stamped with this machine's extension ID. Unzip it into <code>.agents/skills/</code>."
  - n: "4"
    title_zh: "运行命令"
    title_en: "Run commands"
    body_zh: "从技能目录运行命令：<code>list-providers</code>、<code>search --provider</code>、<code>engine-search</code>，或对支持实例的服务（Exa、豆包）用 <code>list-instances</code> / <code>search-instance</code>。"
    body_en: "Run commands from the skill directory: <code>list-providers</code>, <code>search --provider</code>, <code>engine-search</code>, or — for instance-supporting services (Exa, Doubao) — <code>list-instances</code> / <code>search-instance</code>."
