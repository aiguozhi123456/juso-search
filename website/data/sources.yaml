# 搜索来源图标墙 —— 取自 static/icons/*.svg
# name 为中文显示名；name_en 为英文（仅 CJK 来源需要）。
# 分组数量由模板 len .items 计算，不再手写 count。
groups:
  - key: engines
    items:
      - { icon: google,       name: Google }
      - { icon: bing,         name: Bing }
      - { icon: baidu,        name: 百度,      name_en: Baidu }
      - { icon: douyin,       name: 抖音,      name_en: Douyin }
      - { icon: xiaohongshu,  name: 小红书,    name_en: Xiaohongshu }
      - { icon: bilibili,     name: 哔哩哔哩,  name_en: Bilibili }
      - { icon: yandex,       name: Yandex }
      - { icon: duckduckgo,   name: DuckDuckGo }
  - key: ai_search
    items:
      - { icon: tavily,   name: Tavily }
      - { icon: exa,      name: Exa }
      - { icon: brave,    name: Brave }
      - { icon: stepfun,  name: Stepfun }
      - { icon: jina,     name: Jina }
      - { icon: doubao,   name: 豆包,  name_en: Doubao }
  - key: ai_chat
    items:
      - { icon: ai-grok,        name: Grok }
      - { icon: ai-chatgpt,     name: ChatGPT }
      - { icon: ai-deepseek,    name: DeepSeek }
      - { icon: ai-doubao-chat, name: 豆包,   name_en: Doubao }
      - { icon: ai-gemini,      name: Gemini }
  - key: custom
    items:
      - { icon: site,          name: 站外搜索,    name_en: Site Engine }
      - { icon: custom-engine, name: 自定义引擎,  name_en: Custom Engine }
