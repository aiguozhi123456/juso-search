# Hero —— bilingual taglines, each holds both, to render counterpart as subtitle
hero_eyebrow:
  other: "DUAL-FACE SEARCH"
tagline_zh:
  other: "一面为人，一面为智能体。"
tagline_en:
  other: "One face for humans — one for agents."
hero_positioning_human:
  other: "An open-source, two-sided search gateway with locally managed credentials—for humans and local AI agents."
# Agent-face tagline variant (newly written)
tagline_agents_zh:
  other: "让本地智能体，借同一台浏览器搜索。"
tagline_agents_en:
  other: "Let local agents search through the same browser."
hero_positioning_agents:
  other: "In a Chromium browser with Juso installed, local AI agents can call your configured AI search APIs or search conventional engines through a real browser — credentials stay inside the extension, and agents never receive them."
# Neutral overview face (root /) — dual-face thesis
hero_positioning_overview:
  other: "Juso is an open-source, two-faced search gateway: one browser, one set of locally stored keys—a face for people, unifying conventional engines, site search, and AI search into one entry; and a face for agents, where local AI calls the same search through Agent Bridge, with keys never leaving the extension."

