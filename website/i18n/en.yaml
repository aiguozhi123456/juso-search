docs_hub_title:
  other: "Choose your documentation path"
docs_hub_sub:
  other: "Juso is one browser extension, but searching for yourself and connecting local agents are different workflows. Install the extension first, then enter the complete guide that fits your use."
docs_hub_human_tag:
  other: "PEOPLE USE"
docs_hub_human_title:
  other: "Configure, search & switch"
docs_hub_human_body:
  other: "From ready-to-use conventional engines to AI search services, AI Engines, instances, site search, custom engines, cache, and configuration management."
docs_hub_human_link:
  other: "Open people documentation"
docs_hub_agents_tag:
  other: "AGENT ACCESS"
docs_hub_agents_title:
  other: "Bridge, Skill & MCP"
docs_hub_agents_body:
  other: "Understand the default-off Agent Bridge, then choose the extension-delivered Agent Skill or the MCP Server for native clients."
docs_hub_agents_link:
  other: "Open agents documentation"
docs_hub_security_tag:
  other: "SHARED BOUNDARIES"
docs_hub_security_title:
  other: "Keys, data & locality"
docs_hub_security_body:
  other: "Whichever face you use, understand key storage, request destinations, Bridge lifetime, and configuration export boundaries first."
docs_hub_security_link:
  other: "Read security & privacy"
guide_back:
  other: "All documentation"
guide_on_page:
  other: "On this page"
human_doc_eyebrow:
  other: "PEOPLE DOCUMENTATION"
human_doc_title:
  other: "Organise search sources into your own workspace"
human_doc_sub:
  other: "This guide covers the complete people workflow, from the first search to advanced source management. Start with conventional engines that need no key, then configure AI search services or enable AI Engines when useful."
human_doc_nav_start:
  other: "Get started"
human_doc_nav_sources:
  other: "Sources & switching"
human_doc_nav_services:
  other: "AI services & instances"
human_doc_nav_customize:
  other: "Site, custom & AI Engines"
human_doc_nav_local:
  other: "Cache, history & export"
human_doc_start_title:
  other: "Begin with a usable search"
human_doc_start_body:
  other: "After installing, open the Juso search page. Google, Bing, Baidu, Douyin, Xiaohongshu, Bilibili, Yandex, and DuckDuckGo need no API key; enable hidden sources from Settings when needed."
human_doc_sources_title:
  other: "Switch from the search page or result page"
human_doc_sources_body:
  other: "The search page selects sources. On supported conventional result pages, the SERP Switch Bar carries the current query to another engine or hands off to Juso's AI search page."
human_doc_services_title:
  other: "Configure AI search services only when needed"
human_doc_services_body:
  other: "Only AI search services require their respective key. The interface receives configuration status, but never reads stored keys back into the page."
human_doc_instances_title:
  other: "Keep several instances of one service"
human_doc_instances_body:
  other: "For instance-supporting services, save several parameter sets or use cases. Instances share a service key and appear as first-class sources in the quick-switch bar."
human_doc_customize_title:
  other: "Turn sites, tools, and AI Engines into sources"
human_doc_customize_body:
  other: "Site Engines scope a public site with site: queries; Custom Engines use a URL template with one %s placeholder; AI Engines add the AI chat websites you are already signed into as sources."
human_doc_ai_engine_title:
  other: "AI Engine · no API key"
human_doc_ai_engine_card:
  other: "Signed-in ChatGPT, DeepSeek, Gemini, Grok, Doubao, and more"
human_doc_ai_engine_body:
  other: "Enable the AI Engines you need in Settings → Sources. They prefill and automatically submit the current query using your existing browser sign-in; unlike AI search services, they do not need an API key."
human_doc_local_title:
  other: "Keep local data under your control"
human_doc_local_body:
  other: "Successful AI searches are cached per service and normalised query on the current device, and history can be replayed. Refresh for fresh results. Configuration export includes unencrypted keys and preferences, so create it only for a deliberate backup and store it safely."
human_doc_open_app:
  other: "Open people-face overview"
agents_doc_eyebrow:
  other: "AGENTS DOCUMENTATION"
agents_doc_title:
  other: "Let local agents use search within clear boundaries"
agents_doc_sub:
  other: "This guide covers Agent Bridge prerequisites, two integration paths, callable actions, and recovery. Agents receive bounded capabilities and structured results—not keys stored by the extension."
agents_doc_nav_requirements:
  other: "Prerequisites"
agents_doc_nav_bridge:
  other: "Enable Bridge"
agents_doc_nav_skill:
  other: "Agent Skill"
agents_doc_nav_mcp:
  other: "MCP Server"
agents_doc_nav_actions:
  other: "Actions & recovery"
agents_doc_requirements_title:
  other: "Confirm the runtime environment"
agents_doc_requirements_body:
  other: "Install and enable Juso in the Chromium-family browser that will run calls: Chrome, Edge, Chromium, or similar. The Agent Skill requires Python 3.11+. engine-search needs no AI service key; search needs the target provider configured first."
agents_doc_bridge_title:
  other: "Enable two layers of consent"
agents_doc_bridge_body:
  other: "Open extension Options → General → Agent Bridge and enable the master switch. Enable the separate engine-search sub-switch as well when agents should search conventional engines through a real browser. Both are off by default."
agents_doc_skill_title:
  other: "Path A: the extension-delivered Agent Skill"
agents_doc_skill_body:
  other: "In the same settings area, click “Download companion Agent Skill.” The extension stamps the current runtime extension ID into the package; after unzipping, keep scripts and reference intact and place the entire directory in your Agent skills folder."
agents_doc_mcp_title:
  other: "Path B: Server for MCP-native clients"
agents_doc_mcp_body:
  other: "Install the MCP Server with pip install juso-search (Python 3.10+). It uses stdio; set JUSO_EXTENSION_ID and JUSO_CHROME_PATH explicitly in the client's MCP configuration, then add profile and timeout only if needed."
agents_doc_actions_title:
  other: "Discover first, then call explicitly"
agents_doc_actions_body:
  other: "Use list-providers and list-engines to discover the live capabilities first. search requires an explicit provider. For instances, call list-instances and then target an instance with search-instance. engine-search returns ordinary result metadata only, not AI summaries or knowledge panels."
agents_doc_recovery_title:
  other: "Check boundaries before trying to bypass them"
agents_doc_recovery_body:
  other: "For extension_did_not_claim, confirm that Juso is installed and enabled, the Agent Bridge master switch is on, and the launched browser uses the intended profile. If engine-search returns extract-failed, check its separate sub-switch first; consent pages, challenge pages, and unsupported result layouts also return structured failures rather than empty success."
agents_doc_mcp_link:
  other: "Read MCP Server configuration"
agents_doc_open_app:
  other: "Open agents-face overview"
