docs_install_eyebrow:
  other: "SHARED PREREQUISITE"
docs_install_title:
  other: "Start by installing the extension"
docs_install_sub:
  other: "Whether you search yourself or let a local agent search, begin with Juso in a Chromium-family browser."
docs_install_store_title:
  other: "Recommended: Chrome Web Store"
docs_install_store_body:
  other: "For most users: no developer-mode warning and automatic updates."
docs_install_release_title:
  other: "Manual: GitHub Release"
docs_install_release_body:
  other: "Download a release bundle and load its unpacked directory from the extension manager; suited to manual installation."
docs_install_check_title:
  other: "After installation"
docs_install_check_body:
  other: "Open the Juso search page. Conventional engines work directly; configure an API key only when you need an AI search service."
docs_link_store:
  other: "Open Chrome Web Store"
docs_link_release:
  other: "View GitHub Release"
docs_human_eyebrow:
  other: "PEOPLE FACE"
docs_human_title:
  other: "Configure one search entry for yourself"
docs_human_sub:
  other: "The people face is more than a search box: sources, configuration, and local history are all managed in the extension. Start with keyless conventional engines, then add AI search services when you need them."
docs_human_sources_title:
  other: "Sources & switching"
docs_human_sources_body:
  other: "Conventional engines, site search, custom engines, and AI chat engines can all become unified sources that switch from the search page and supported result pages."
docs_human_keys_title:
  other: "Services & keys"
docs_human_keys_body:
  other: "Only AI search services need their respective key. Keys remain local and are read by the background worker."
docs_human_instances_title:
  other: "Instances & groups"
docs_human_instances_body:
  other: "Save several tuned instances for one service, then organise the quick-switch bar by order, visibility, and groups."
docs_human_history_title:
  other: "Cache, history & configuration"
docs_human_history_body:
  other: "Successful AI searches can be replayed locally. Configuration export is user-initiated and sensitive; keep the exported file safe."
docs_human_open:
  other: "See the people-face overview"
docs_agents_eyebrow:
  other: "AGENTS FACE"
docs_agents_title:
  other: "Let local agents search through your browser"
docs_agents_sub:
  other: "Agent Bridge is a default-off, short-lived, loopback-only capability channel. Agents invoke bounded search actions without receiving keys stored by the extension."
docs_agents_step_bridge_title:
  other: "1. Enable Agent Bridge"
docs_agents_step_bridge_body:
  other: "In the extension, open Options → General and enable the master switch. Enable the separate engine-search switch as well if agents should search conventional engines."
docs_agents_step_skill_title:
  other: "2A. Use the companion Agent Skill"
docs_agents_step_skill_body:
  other: "Download the skill from the same settings area. The extension stamps it with the current runtime extension ID; unpack it and place the entire folder in your skills directory."
docs_agents_step_mcp_title:
  other: "2B. Or use the MCP Server"
docs_agents_step_mcp_body:
  other: "For MCP-native clients. Install juso-search from PyPI and configure the extension ID, Chromium executable, and optional profile and timeout in the client."
docs_agents_step_commands_title:
  other: "3. Discover capabilities, then search"
docs_agents_step_commands_body:
  other: "List configured providers and supported engines first. API search requires an explicit provider; instance search starts by obtaining an instance id."
docs_agents_open:
  other: "See the agents-face overview"
docs_agents_docs:
  other: "Read MCP installation"
docs_command_label:
  other: "Example commands"
docs_security_eyebrow:
  other: "SECURITY & BOUNDARIES"
docs_security_title:
  other: "Search capability without exporting your keys"
docs_security_sub:
  other: "Juso operates no request relay. Queries go directly to your selected search service or conventional engine; understand these boundaries before you begin."
docs_security_keys_title:
  other: "Keys stay locally managed"
docs_security_keys_body:
  other: "Stored keys are read only by the extension background service worker; page UI and local agents do not read their values."
docs_security_bridge_title:
  other: "Bridge is default-off and per-call"
docs_security_bridge_body:
  other: "Every Agent call uses a fresh loopback port, token, and request identity, then expires on completion, failure, or timeout."
docs_security_export_title:
  other: "You retain exported configuration"
docs_security_export_body:
  other: "Configuration export includes unencrypted keys and preferences. It is created only when you request it and should be stored as carefully as a password."
docs_security_open:
  other: "See the privacy model"
docs_cta_h2:
  other: "Ready to start from one search entry?"
docs_cta_p:
  other: "After installing the extension, begin with conventional engines, then add AI search and local-agent access when you are ready."

