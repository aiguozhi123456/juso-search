docs_link_store:
  other: "打开 Chrome Web Store"
docs_link_release:
  other: "查看 GitHub Release"
docs_human_eyebrow:
  other: "人类面"
docs_human_title:
  other: "为自己配置一个搜索入口"
docs_human_sub:
  other: "人类侧不只是搜索框：来源、配置与本地历史都在扩展内管理。先从无需密钥的传统引擎开始，再按需要加入 AI 搜索服务。"
docs_human_sources_title:
  other: "来源与切换"
docs_human_sources_body:
  other: "传统引擎、站外搜索、自定义引擎和 AI 对话引擎都可作为统一搜索来源，在搜索页、划词弹窗和支持的结果页之间切换。"
docs_human_keys_title:
  other: "服务与密钥"
docs_human_keys_body:
  other: "只有 AI 搜索服务需要配置对应密钥。密钥保存在本地，并由后台 worker 读取。"
docs_human_instances_title:
  other: "实例与分组"
docs_human_instances_body:
  other: "为同一服务保存多套调好参数的实例，按你的顺序、可见性与分组组织快切栏。"
docs_human_history_title:
  other: "缓存、历史与配置"
docs_human_history_body:
  other: "成功的 AI 搜索可在本机重放；配置导出由你主动触发，导出文件包含敏感信息，应自行保管。"
docs_human_open:
  other: "查看人类面概览"
docs_agents_eyebrow:
  other: "智能体面"
docs_agents_title:
  other: "让本地智能体借浏览器搜索"
docs_agents_sub:
  other: "Agent Bridge 是默认关闭、短生命周期、仅回环地址的能力通道。智能体调用有限的搜索动作，但不会取得扩展内存储的密钥。"
docs_agents_step_bridge_title:
  other: "1. 开启 Agent Bridge"
docs_agents_step_bridge_body:
  other: "在扩展 Options → 通用中开启总开关；如需让智能体检索传统搜索引擎，再单独开启 engine-search 子开关。"
docs_agents_step_skill_title:
  other: "2A. 使用配套 Agent Skill"
docs_agents_step_skill_body:
  other: "在同一设置区域下载技能包。扩展会自动写入当前浏览器对应的 Bridge 地址；解压后将整个目录放入你的技能目录。"
docs_agents_step_mcp_title:
  other: "2B. 或使用 MCP Server"
docs_agents_step_mcp_body:
  other: "面向 MCP 原生客户端。通过 PyPI 安装 juso-search，并在客户端配置 JUSO_BROWSER_PATH；Chrome 使用扩展 ID，Firefox 使用完整的 JUSO_BRIDGE_URL，profile 与超时可按需设置。"
docs_agents_step_commands_title:
  other: "3. 发现能力，再执行搜索"
docs_agents_step_commands_body:
  other: "先列出已配置的服务与支持的引擎；API 搜索必须显式指定 provider，实例搜索先取得 instance id。"
docs_agents_open:
  other: "查看智能体面概览"
docs_agents_docs:
  other: "查看 MCP 安装说明"
docs_command_label:
  other: "示例命令"
docs_security_eyebrow:
  other: "安全与边界"
docs_security_title:
  other: "能力可用，密钥不外流"
docs_security_sub:
  other: "双面搜不运营请求中转；查询直达你选择的搜索服务或传统搜索引擎。请在开始前理解下列边界。"
docs_security_keys_title:
  other: "密钥仅本地管理"
docs_security_keys_body:
  other: "已存储密钥仅由扩展后台 service worker 读取；页面 UI 与本地智能体不会读取这些值。"
docs_security_bridge_title:
  other: "Bridge 默认关闭、按次失效"
docs_security_bridge_body:
  other: "每次 Agent 调用使用新的回环端口、令牌与请求标识，完成、失败或超时后即失效。"
docs_security_export_title:
  other: "导出文件由你保管"
docs_security_export_body:
  other: "配置导出包含未加密的密钥与偏好；仅在你主动触发时创建，应像密码一样妥善保存。"
docs_security_open:
  other: "查看隐私模型"
docs_cta_h2:
  other: "准备好从一个入口开始搜索了吗？"
docs_cta_p:
  other: "安装扩展后，你可以先从传统搜索引擎开始，再逐步配置 AI 搜索和本地智能体接入。"

# 文档树（/docs/、/human/docs/、/agents/docs/）
docs_hub_title:
  other: "选择你的文档路径"
docs_hub_sub:
  other: "双面搜由同一个浏览器扩展承载，但人类使用与本地智能体接入是两条不同的工作流。先安装扩展，再进入适合你的完整指南。"
