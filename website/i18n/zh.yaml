# 区块标题
sec_sources:
  other: "搜索来源"
sec_sources_sub:
  other: "五类来源，同一个入口。传统引擎无需配置即可使用；AI 搜索服务需配置对应密钥。"
sec_showcase_human:
  other: "切换与搜索"
sec_showcase_human_sub:
  other: "独立搜索页选择来源，结果页内一键切换——AI 搜索的综合答案与传统引擎的结果，在同一套切换里流动。"
sec_trust_human:
  other: "隐私模型"
sec_trust_human_sub:
  other: "只陈述可验证的事实：密钥本地存、仅 worker 读、直达所选服务、无中转无遥测。"

sec_deeper_human:
  other: "深入：实例 / 缓存 / 来源"
sec_deeper_human_sub:
  other: "同一服务可并存多套调好参数的实例，搜索结果与历史就近缓存，搜索来源在本地集中管理。"

sec_capability_agents:
  other: "智能体能力"
sec_capability_agents_sub:
  other: "四项能力，覆盖 AI 搜索 API 调用与传统引擎检索。"
sec_cli_agents:
