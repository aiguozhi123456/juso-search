# Hero —— 双语 tagline 各持两份，便于互为副标
hero_eyebrow:
  other: "DUAL-FACE SEARCH"
tagline_zh:
  other: "一面为人，一面为智能体。"
tagline_en:
  other: "One face for humans — one for agents."
hero_positioning_human:
  other: "双面搜 / Juso 是一个开源的搜索聚合与切换工具：把传统搜索引擎、站外搜索（Site Engine）和你已配置的 AI 搜索服务统一到同一个入口。"
# 智能体面 tagline 变体（新写）
tagline_agents_zh:
  other: "让本地智能体，借同一台浏览器搜索。"
tagline_agents_en:
  other: "Let local agents search through the same browser."
hero_positioning_agents:
  other: "在装有双面搜的 Chrome 系浏览器或 Firefox 中，本地 AI 智能体可调用你已配置的 AI 搜索 API，或借真实浏览器检索传统搜索引擎——密钥始终留在扩展内，智能体不会取得它们。"
# 中性总览面（/ 根页）—— 双面论点
hero_positioning_overview:
  other: "双面搜 / Juso 是开源的双面搜索网关：同一台浏览器、同一套本地密钥，一面为人——把传统引擎、站外搜索与 AI 搜索统一到一个入口；一面为智能体——本地 AI 经 Agent Bridge 调用同一套搜索，密钥始终留在扩展内。"

# 中性页 hero 下拉键（无障碍标注，跳转双门卡片）
hero_scroll:
  other: "滚动到两个入口"
hero_scroll_caption:
  other: "为自己，或为智能体"

