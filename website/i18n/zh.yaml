docs_hub_security_link:
  other: "查看安全与隐私说明"
guide_back:
  other: "全部文档"
guide_on_page:
  other: "本页内容"
human_doc_eyebrow:
  other: "PEOPLE DOCUMENTATION"
human_doc_title:
  other: "把搜索来源组织成你的工作台"
human_doc_sub:
  other: "这份手册覆盖个人用户从第一次搜索到高级来源管理的完整路径。先从无需密钥的传统引擎开始，再按需要配置 AI 搜索服务或启用 AI Engine。"
human_doc_nav_start:
  other: "开始使用"
human_doc_nav_sources:
  other: "来源与切换"
human_doc_nav_services:
  other: "AI 服务与实例"
human_doc_nav_customize:
  other: "站外、自定义与 AI Engine"
human_doc_nav_local:
  other: "缓存、历史与导出"
human_doc_start_title:
  other: "从一个可用的搜索开始"
human_doc_start_body:
  other: "安装后打开双面搜搜索页。Google、Bing、百度、抖音、小红书、哔哩哔哩、Yandex、DuckDuckGo 与搜狗微信文章搜索不需要 API 密钥；未显示的来源可在设置页启用。"
human_doc_sources_title:
  other: "在搜索页与结果页之间切换"
human_doc_sources_body:
  other: "搜索页负责选择来源；选中网页文字时，划词搜索弹窗会以已设定来源直接发起搜索，也可展开选择其他已启用来源；在受支持的传统搜索结果页，SERP 切换栏可沿用当前查询切换到其他引擎，或跳转到双面搜的 AI 搜索页。"
human_doc_services_title:
  other: "按需配置 AI 搜索服务"
human_doc_services_body:
  other: "只有调用 AI 搜索服务时才需要配置对应密钥。服务配置状态会回传给界面，已存储的密钥不会被页面重新读取。"
human_doc_instances_title:
  other: "为同一服务保存多套实例"
human_doc_instances_body:
  other: "支持实例的服务可按不同参数或使用场景创建多套实例；实例共享服务密钥，并会作为快切栏的一等来源出现。"
human_doc_customize_title:
  other: "把站点、工具与 AI Engine 都变成来源"
human_doc_customize_body:
  other: "Site Engine 用 site: 限定公开站点；Custom Engine 使用带一个 %s 占位符的 URL 模板；AI Engine 则把你已登录的 AI 对话网站直接加入来源列表。"
human_doc_ai_engine_title:
  other: "AI Engine · 无需 API Key"
human_doc_ai_engine_card:
  other: "ChatGPT、DeepSeek、Gemini、Grok、豆包等已登录网站"
human_doc_ai_engine_body:
  other: "在设置 → 来源中启用需要的 AI Engine。它们会预填当前查询并自动提交，直接复用浏览器已有登录态；与 AI 搜索服务不同，不需要配置 API Key。"
human_doc_local_title:
  other: "让本地数据保持可控"
human_doc_local_body:
  other: "成功的 AI 搜索会按服务与规范化查询缓存在当前设备，历史可重放。需要最新结果时使用刷新；配置导出包含未加密的密钥与偏好，应仅在你主动需要备份时创建并安全保管。"
human_doc_open_app:
  other: "打开人类面概览"
agents_doc_eyebrow:
  other: "AGENTS DOCUMENTATION"
agents_doc_title:
  other: "让本地智能体按边界使用搜索"
agents_doc_sub:
  other: "这份手册说明 Agent Bridge 的前置条件、两种接入方式、可调用动作与常见恢复路径。智能体获得的是受限能力和结构化结果，不是扩展内存储的密钥。"
agents_doc_nav_requirements:
  other: "前置条件"
agents_doc_nav_bridge:
  other: "开启 Bridge"
agents_doc_nav_skill:
  other: "Agent Skill"
agents_doc_nav_mcp:
  other: "MCP Server"
agents_doc_nav_actions:
  other: "动作与恢复"
agents_doc_requirements_title:
  other: "确认运行环境"
agents_doc_requirements_body:
  other: "在将运行调用的 Chrome、Edge、Chromium、Firefox 或其他受支持浏览器中安装并启用双面搜。Agent Skill 需要 Python 3.11+；使用 engine-search 不需要 AI 服务密钥，调用 search 时才需要先配置目标 provider。"
agents_doc_bridge_title:
  other: "开启两层门控"
agents_doc_bridge_body:
  other: "打开扩展 Options → 通用 → Agent Bridge，先开启总开关。若需要通过真实浏览器检索传统搜索引擎，再单独开启 engine-search 子开关。两项能力默认关闭。"
agents_doc_skill_title:
  other: "路径 A：由扩展交付的 Agent Skill"
agents_doc_skill_body:
  other: "在同一设置区域点击“下载配套 Agent Skill”。扩展会写入当前浏览器对应的 Bridge 地址；解压后保持 scripts 与 reference 目录完整，并放入你的 Agent 技能目录。"
agents_doc_mcp_title:
  other: "路径 B：面向 MCP 原生客户端的 Server"
agents_doc_mcp_body:
  other: "通过 pip install juso-search 安装 MCP Server（需要 Python 3.10+）。它使用 stdio；在客户端的 MCP 配置中显式设置 JUSO_BROWSER_PATH 与 Chrome 的 JUSO_EXTENSION_ID，profile 与 timeout 可按需配置。"
agents_doc_mcp_firefox:
  other: "若使用 Firefox，改为设置 JUSO_BRIDGE_URL（完整 moz-extension://…/bridge.html 地址）；Firefox 的 Bridge 地址按安装实例生成，下载配套 Agent Skill 可自动写入正确值。"
agents_doc_actions_title:
  other: "先发现，再明确调用"
agents_doc_actions_body:
  other: "先用 list-providers 与 list-engines 发现当前可用能力；search 必须显式指定 provider；实例搜索先调用 list-instances，再用 search-instance 指定 instance id。engine-search 只返回普通结果元数据，不承诺 AI 摘要或知识面板。"
agents_doc_recovery_title:
  other: "失败时先检查边界，而不是绕过它"
agents_doc_recovery_body:
  other: "若出现 extension_did_not_claim，请检查扩展是否安装并启用、Agent Bridge 总开关是否开启，以及启动的浏览器是否使用了正确 profile。若 engine-search 返回 extract-failed，先检查其独立子开关；验证页、同意页、挑战页与不支持的结果布局也会返回结构化失败，而不是空成功。"
agents_doc_mcp_link:
  other: "阅读 MCP Server 配置"
agents_doc_open_app:
  other: "打开智能体面概览"
