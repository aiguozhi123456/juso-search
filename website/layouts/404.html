{{/* 品牌化 404 —— 复用 baseof，双语文案走 i18n */}}
{{ define "title" }}404 — {{ .Site.Title }}{{ end }}

{{ define "main" }}
<section class="section not-found">
  <div class="wrap">
    <div class="eyebrow reveal"><span class="dot"></span>404</div>
    <h1 class="wordmark reveal">404</h1>
    <p class="lead reveal">{{ i18n "not_found_text" }}</p>
    <div class="reveal">
      <a class="btn btn--primary" href="{{ "" | relLangURL }}">{{ i18n "not_found_home" }}</a>
      <a class="btn btn--ghost" href="{{ "agents/" | relLangURL }}">{{ i18n "nav_agent" }}</a>
    </div>
  </div>
</section>
{{ end }}
