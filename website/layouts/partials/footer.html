{{/* 页脚 */}}
<footer class="site-foot">
  <div class="wrap site-foot__inner">
    <div class="site-foot__top">
      <div class="site-foot__brand">
        <a class="brandlock" href="{{ "" | relLangURL }}">
          <span class="brandlock__cn">双面搜</span>
          <span class="brandlock__sep">/</span>
          <span class="brandlock__en">Juso</span>
        </a>
        <p>{{ i18n "footer_tagline" }}</p>
        <a class="foot-agent-link" href="{{ "agents/" | relLangURL }}">
          {{ i18n "footer_agent_access" }}<span class="foot-agent-link__arrow" aria-hidden="true">→</span>
        </a>
      </div>
      <div class="site-foot__col">
        <h4>{{ i18n "footer_get" }}</h4>
        <a href="{{ .Site.Params.cwsURL }}" target="_blank" rel="noopener">Chrome Web Store</a>
        <a href="{{ .Site.Params.releaseURL }}" target="_blank" rel="noopener">GitHub Release</a>
      </div>
      <div class="site-foot__col">
        <h4>{{ i18n "footer_code" }}</h4>
        <a href="{{ .Site.Params.githubURL }}" target="_blank" rel="noopener">GitHub</a>
        <a href="{{ .Site.Params.releaseURL }}" target="_blank" rel="noopener">{{ i18n "footer_releases" }}</a>
      </div>
    </div>
    <div class="site-foot__bottom">
      <span>{{ i18n "footer_license" }}</span>
      <span class="tm">{{ i18n "footer_tm" }}</span>
    </div>
  </div>
</footer>
