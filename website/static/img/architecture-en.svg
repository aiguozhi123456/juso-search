  <rect x="485" y="984" width="16" height="12" rx="3" fill="#ffffff" stroke="#c8372d" stroke-width="1.5"/>
  <text x="509" y="994" fill="#5f5f5f" font-size="9">Shared Core</text>
  <rect x="581" y="984" width="16" height="12" rx="3" fill="#f4f2f1" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="605" y="994" fill="#5f5f5f" font-size="9">External</text>
  <rect x="677" y="984" width="16" height="12" rx="3" fill="rgba(200,55,45,0.06)" stroke="#c8372d" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="701" y="994" fill="#5f5f5f" font-size="9">Security Boundary</text>

  <!-- ══ Layer 8 · Title ══ -->
  <text x="1000" y="54" fill="#8a8a8a" font-size="8" letter-spacing="2" text-anchor="end">ARCHITECTURE · CHROME MV3</text>
  <text x="40" y="62" font-size="18" font-weight="700"><tspan fill="#c8372d">双面搜</tspan><tspan fill="#8a8a8a"> / </tspan><tspan fill="#1a1a1a">Juso</tspan></text>
  <text x="40" y="84" fill="#5f5f5f" font-size="9">Two-Sided Browser Extension Architecture</text>
</svg>
