  <!-- ══ Layer 6 · Text ══ -->
  <text x="54" y="130" fill="#c8372d" font-size="9" font-weight="600" letter-spacing="1">Human Side</text>
  <text x="714" y="130" fill="#5a5a5a" font-size="9" font-weight="600" letter-spacing="1">Agent Side</text>
  <text x="980" y="508" fill="#c8372d" font-size="10" font-weight="700" letter-spacing="1" text-anchor="end">Shared Core</text>
  <text x="372" y="510" fill="#c8372d" font-size="8" font-weight="500">Keys read by Worker only — invisible to UI &amp; agents</text>

  <text x="190" y="168" fill="#1a1a1a" font-size="11" font-weight="600" text-anchor="middle">Search Page</text>
  <text x="190" y="188" fill="#5f5f5f" font-size="9" text-anchor="middle">Source select · AI search · cache &amp; history</text>
  <text x="190" y="274" fill="#1a1a1a" font-size="11" font-weight="600" text-anchor="middle">SERP Switch Bar</text>
  <text x="190" y="292" fill="#5f5f5f" font-size="8" text-anchor="middle">Google · Bing · Baidu · Douyin · Xiaohongshu</text>
  <text x="190" y="304" fill="#5f5f5f" font-size="8" text-anchor="middle">Bilibili · Yandex · DuckDuckGo</text>
  <text x="190" y="316" fill="#5f5f5f" font-size="8" text-anchor="middle">in-page switching</text>
  <text x="190" y="388" fill="#1a1a1a" font-size="11" font-weight="600" text-anchor="middle">Options</text>
  <text x="190" y="408" fill="#5f5f5f" font-size="8" text-anchor="middle">local keys · Site/Custom Engines · instances</text>

  <text x="850" y="223" fill="#1a1a1a" font-size="11" font-weight="600" text-anchor="middle">Agent Skill · Python CLI</text>
  <text x="850" y="243" fill="#5f5f5f" font-size="9" text-anchor="middle">list-providers · search · engine-search</text>
  <text x="850" y="256" fill="#5f5f5f" font-size="9" text-anchor="middle">list-instances · search-instance</text>
  <text x="850" y="333" fill="#1a1a1a" font-size="11" font-weight="600" text-anchor="middle">Agent Bridge</text>
  <text x="850" y="353" fill="#5f5f5f" font-size="9" text-anchor="middle">short-lived · loopback · one-shot token</text>

  <text x="520" y="548" fill="#1a1a1a" font-size="12" font-weight="700" text-anchor="middle">Background Worker</text>
  <text x="520" y="570" fill="#5f5f5f" font-size="9" text-anchor="middle">Service Worker · message gateway · provider exec</text>
  <text x="850" y="548" fill="#1a1a1a" font-size="11" font-weight="600" text-anchor="middle">Provider Adapters</text>
  <text x="850" y="570" fill="#5f5f5f" font-size="8" text-anchor="middle">Tavily · Exa · Brave · Stepfun · Jina · Doubao</text>
  <text x="500" y="718" fill="#1a1a1a" font-size="11" font-weight="600" text-anchor="middle">chrome.storage.local</text>
  <text x="500" y="734" fill="#5f5f5f" font-size="9" text-anchor="middle">local keys · prefs · cache</text>

  <text x="190" y="894" fill="#1a1a1a" font-size="11" font-weight="600" text-anchor="middle">Search Engines</text>
  <text x="190" y="912" fill="#5f5f5f" font-size="8" text-anchor="middle">Google · Bing · Baidu · Douyin · Xiaohongshu</text>
  <text x="190" y="924" fill="#5f5f5f" font-size="8" text-anchor="middle">Bilibili · Yandex · DuckDuckGo</text>
  <text x="530" y="894" fill="#1a1a1a" font-size="11" font-weight="600" text-anchor="middle">AI Chat Engines</text>
  <text x="530" y="912" fill="#5f5f5f" font-size="8" text-anchor="middle">Grok · ChatGPT · DeepSeek · Doubao · Gemini</text>
  <text x="850" y="894" fill="#1a1a1a" font-size="11" font-weight="600" text-anchor="middle">AI Search APIs</text>
  <text x="850" y="912" fill="#5f5f5f" font-size="8" text-anchor="middle">Tavily · Exa · Brave · Stepfun · Jina · Doubao</text>

  <text x="283" y="549" fill="#c8372d" font-size="8" text-anchor="middle">messaging</text>
  <text x="725" y="462" fill="#5a5a5a" font-size="8" text-anchor="middle">one-shot bounded call</text>
  <text x="862" y="735" fill="#5f5f5f" font-size="8">REST / MCP</text>
  <text x="162" y="645" fill="#5f5f5f" font-size="8">browser navigation</text>
  <text x="648" y="735" fill="#5f5f5f" font-size="8">navigate · inject</text>
  <text x="534" y="645" fill="#c8372d" font-size="8">reads keys / writes prefs</text>

