    </marker>
    <marker id="arrow-brand" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c8372d"/>
    </marker>
    <marker id="arrow-agent" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5a5a5a"/>
    </marker>
  </defs>

  <!-- ══ Layer 1 · Background ══ -->
  <rect width="1040" height="1030" fill="#ffffff"/>
  <rect width="1040" height="1030" fill="url(#grid)"/>

